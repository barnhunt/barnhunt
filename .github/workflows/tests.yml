name: Tests

on:
  workflow_call:
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows
    outputs:
      version-type:
        description: |
          Type of version (from VCS version). This is one of 'local', 'dev', 'pre',
          or 'release'.

          Note that unless a commit is tagged, the version type will always be 'local'.
        value: ${{ jobs.build.outputs.version-type }}

  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: 'windows-latest'
            python-version: '3.15'
            install-inkscape: true
          - os: 'macos-latest'
            python-version: '3.15'
            install-inkscape: true
          - python-version: '3.15'
            install-inkscape: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install inkscape (apt-get)
      if: runner.os == 'Linux' && matrix.install-inkscape
      run: |
        sudo apt-get update
        sudo apt-get install -y inkscape

    - name: Install inkscape (chocolatey)
      if: runner.os == 'Windows' && matrix.install-inkscape
      run: choco install --no-progress --timeout 600 inkscape

    - name: Install inkscape (homebrew)
      if: runner.os == 'macOS' && matrix.install-inkscape
      # This step seems to fail sporadically
      continue-on-error: true
      run: brew install homebrew/cask/inkscape

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Get Inkscape Info
      run: |
        # Use inkscape in the hopes that it will run faster during the
        # tests (on Windows).
        if inkscape --debug-info; then
          inkscape --query-height tests/drawing.svg
        fi
      shell: bash

    - name: Test with tox
      run: tox
      env:
        # GITHUB_TOKEN gives us higher GH REST API rate-limits
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-data-${{ matrix.python-version }}-${{ matrix.os }}
        path: .coverage.*
        include-hidden-files: true
        retention-days: 1       # save money

  coverage:
    name: Coverage Report
    needs: pytest
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coverage[toml]
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: coverage-data-*
        merge-multiple: true
    - name: Test coverage
      run: |
        coverage combine
        coverage report --fail-under=100 --show-missing

  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    env:
      python-version: '3.15'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # Install a specific version of uv.
        version: "0.13.7"
        python-version: ${{ env.python-version }}
    - name: pre-commit cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/pre-commit
          ~/.cache/pip
        key: py-${{ env.python-version }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

    - name: Lint
      run: uv tool run tox -e lint

    - name: Mypy
      if: always()
      run: uv run --no-dev --group=mypy mypy barnhunt tests

    - name: Pre-Commit
      if: always()
      run: uv tool run pre-commit run --all-files

  build:
    name: Build python package
    needs: [pytest, coverage, lint]
    runs-on: ubuntu-latest
    outputs:
      version-type: ${{ steps.classify-version.outputs.version-type }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"

    - run: uv build

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        retention-days: 1       # save money

    - name: Classify Version
      id: classify-version
      run: |
        uv tool run --with packaging,setuptools-scm python -c '
        import sys, packaging.version, setuptools_scm
        version = packaging.version.parse(setuptools_scm.get_version())
        if version.local:
            version_type = "local"
        elif version.is_devrelease:
            version_type = "dev"
        elif version.is_prerelease:
            version_type = "pre"
        else:
            version_type = "release"
        print(f"version-type={version_type}")
        print(f"version-type={version_type}", file=sys.stderr)
        ' >> "$GITHUB_OUTPUT"
