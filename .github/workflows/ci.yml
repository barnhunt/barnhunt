name: CI

on:
  push:
    branches:
      - '*'
    tags:
      # v* are protected tags
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:

  tests:
    name: Run Tests and Build Python Dist
    # XXX: quoting "uses" keeps gha-update from puking on this with cryptic
    # `string indices must be integers` exception.
    'uses': $/.github/workflows/tests.yml

  pypi-publish:
    name: Upload to PyPI
    needs: [tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/barnhunt
    permissions:
      id-token: write           # needed to publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  gh-release:
    name: Post GH Release
    needs: [tests, pypi-publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write           # to create GH release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create Release
        # shellcheck disable=SC2086
        run: gh release create "${TAG}" --generate-notes ${PRE:+--prerelease}
        env:
          TAG: ${{ github.ref_name }}
          PRE: ${{ case( needs.tests.outputs.version-type != 'release', 'yes', '' ) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
